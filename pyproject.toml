[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "udisc-mcp"
version = "0.1.0"
description = "Read-only MCP server that answers questions about UDisc scorecard CSV exports"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
]

[project.optional-dependencies]
# Exact pins: a new pytest or ruff release shouldn't turn a run red without a code change. Bump deliberately.
test = ["pytest==9.1.1"]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[project.scripts]
udisc-mcp = "udisc_mcp:main"

[tool.setuptools]
py-modules = ["udisc_data", "udisc_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Same rule set as grade-watch: pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, ruff, comprehensions,
# pylint errors/warnings, pep8-naming, return hygiene, pathlib and naive datetimes.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PLE", "PLW", "N", "RET", "PTH", "DTZ"]
