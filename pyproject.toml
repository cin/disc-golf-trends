[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "disc-golf-trends"
version = "0.1.0"
description = "Your disc golf rounds and throws, from your own UDisc and TechDisc exports: MCP server, dashboard and website"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
]

[project.optional-dependencies]
# Exact pins: a new pytest or ruff release shouldn't turn a run red without a code change. Bump deliberately.
test = ["pytest==9.1.1"]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[project.scripts]
disc-golf-trends-mcp = "udisc_mcp:main"

[tool.setuptools]
# Every top-level module. Install with `pip install -e .`: .env, dashboard_template.html and dashboards/ are found
# relative to the checkout, so a regular (copying) install would not have them.
py-modules = ["common", "config", "dashboard", "udisc_data", "techdisc_data", "udisc_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Same rule set as grade-watch: pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, ruff, comprehensions,
# pylint errors/warnings, pep8-naming, return hygiene, pathlib and naive datetimes.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PLE", "PLW", "N", "RET", "PTH", "DTZ"]
